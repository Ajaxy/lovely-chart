name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # The newest Ubuntu the locked playwright-core installs its headless shell on, to move with a bump of it
    runs-on: ubuntu-26.04
    # A hung run ends the job in place of the default of six hours
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The headless shell of the Chromium the locked playwright-core pins, the browser the e2e test runs in
      - run: npx playwright-core install --with-deps --only-shell chromium
      - run: npm test
