  <script>
    // The skin goes on before the first paint: the reader's choice, or the system's
    (() => {
      let theme;
      try {
        theme = localStorage.getItem('lovely-chart-docs-theme');
      } catch {
        theme = undefined;
      }
      const isDark = theme ? theme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('theme-dark', isDark);
    })();
  </script>

<noscript>
  <div class="gallery">
    <p>LovelyChart is a small, dependency-free library of Telegram-style interactive charts for the web, minimalist and
      lovely out of the box. Give it an element and your data, and it draws a line, area, bar, step, pie or donut chart
      on canvas, with a tooltip, a legend, a draggable minimap and drill-down zooming built in.
      The <a href="../guide/">guide</a> covers every feature.</p>
    <p>The examples run in JavaScript. The code of each is listed in <a href="../llms.txt">llms.txt</a>, and is on
      <a href="https://github.com/Ajaxy/lovely-chart/tree/master/docs/examples/code">GitHub</a>.</p>
